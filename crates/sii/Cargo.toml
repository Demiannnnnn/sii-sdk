[package]
name = "sii"
description = "Unofficial Rust SDK for Chilean SII DTE (Electronic Tax Documents)"
readme = "README.md"
documentation = "https://docs.rs/sii"
keywords = ["sii", "dte", "chile", "factura", "taxes"]
categories = ["api-bindings", "finance", "cryptography"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
http = ["dep:ureq"]
pkcs12 = ["dep:p12"]
serde = ["dep:serde"]
tracing = []

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
quick-xml = { workspace = true }
rsa = { workspace = true }
sha1 = { workspace = true, features = ["oid"] }
sha2 = { workspace = true, features = ["oid"] }
x509-cert = { workspace = true }
der = { workspace = true }
base64 = { workspace = true }
p12 = { workspace = true, optional = true }
time = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
