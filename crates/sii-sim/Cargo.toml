[package]
name = "sii-sim"
description = "Unofficial simulator for Chilean SII DTE endpoints and services"
readme = "README.md"
documentation = "https://docs.rs/sii-sim"
keywords = ["sii", "dte", "simulator", "testing", "chile"]
categories = ["development-tools::testing", "simulation"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "sii-sim"
path = "src/main.rs"

[features]
default = []
http = ["dep:ureq", "sii/http"]

[dependencies]
sii = { workspace = true, default-features = false }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
quick-xml = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
sii = { workspace = true, features = ["http"] }
ureq = { workspace = true }
rsa = { workspace = true }
sha1 = { workspace = true }
time = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
